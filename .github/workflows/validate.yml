name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.332
      - name: Validate the marketplace and every plugin
        run: |
          set -euo pipefail
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: Test lam
        run: claude plugin test plugins/lam
      - name: Test the prose linter
        run: node --test 'plugins/writing/bin/*.test.mjs'
      - name: Lint the repository's Markdown
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          node plugins/writing/bin/prose-lint.mjs --format github --min-severity warning \
            README.md claude-md/*.md plugins/*/README.md plugins/*/skills/**/*.md
