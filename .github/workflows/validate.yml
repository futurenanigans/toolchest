name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.332
      - name: Validate the marketplace and every plugin
        run: |
          set -euo pipefail
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: Keep in-tree plugins on commit-sha versioning
        run: |
          set -euo pipefail
          # A version in plugin.json or a relative-path marketplace entry freezes hosted installs on their cached copy until it changes.
          pinned=$(jq -r '.plugins[] | select((.source | type) == "string" and has("version")) | .name' .claude-plugin/marketplace.json)
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            if jq -e 'has("version")' "$manifest" > /dev/null; then pinned+=$'\n'"$manifest"; fi
          done
          if [ -n "${pinned//$'\n'/}" ]; then echo "::error::version set for an in-tree plugin:$pinned"; exit 1; fi
      - name: Test the plugins' hooks
        run: |
          set -euo pipefail
          for plugin in plugins/*/; do
            if [ -d "${plugin}tests" ]; then claude plugin test "$plugin"; fi
          done
      - name: Typecheck Trestle hooks and server
        working-directory: plugins/trestle
        run: bun install --frozen-lockfile && bun run typecheck
      - name: Test trestle
        working-directory: plugins/trestle
        run: bun test src/__tests__
      - name: Test gimlet's rules against their fixtures
        run: bash plugins/gimlet/bin/gimlet test
      - name: Check the Gimlet runner and sourced libraries
        working-directory: plugins/gimlet
        run: |
          shellcheck -a -x -S warning -P SCRIPTDIR bin/gimlet
          shellcheck -S warning test/*.sh
      - name: Exercise Gimlet scanner outcomes
        run: |
          bash plugins/gimlet/test/scan.sh
          bash plugins/gimlet/test/reports.sh
      - name: Test the prose linter
        run: node --test 'plugins/writing/bin/*.test.mjs' 'plugins/writing/lint/*.test.mjs'
      - name: Lint the repository's Markdown
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          node plugins/writing/bin/prose-lint.mjs --format github --min-severity warning --fail-on warning \
            README.md claude-md/*.md plugins/*/README.md plugins/*/skills/**/*.md
      - name: Check synced prose and shared audit sections
        run: node scripts/check-synced-prose.mjs

  trestle-windows-prompt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Pass quoted and long prompts through a Windows batch shim
        working-directory: plugins/trestle
        run: bun install --frozen-lockfile && bun test src/__tests__/goal_loop.spec.ts -t "standalone prompt arrives intact"
      - name: Exercise Gimlet under Git Bash
        shell: bash
        run: |
          bash plugins/gimlet/test/scan.sh
          bash plugins/gimlet/test/reports.sh
