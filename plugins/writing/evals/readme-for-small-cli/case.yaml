schema_version: "1.1"
name: readme-for-small-cli
tags: [writing-style, readme]
context:
  scaffold_script: place-files.sh
expected_outcome: |
  README.md for the tally CLI says what it does, how to install and run it, and what
  --top and --ignore-case do, in a page short enough to need few or no headings. It has no
  em or en dashes, no Title Case or emoji headings, no Overview or Key features boilerplate,
  no --- separators, no bold-colon bullets, and no closing summary.
