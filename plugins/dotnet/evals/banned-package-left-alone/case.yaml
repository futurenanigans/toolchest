schema_version: "1.1"
name: banned-package-left-alone
description: Needs network access to nuget.org for discovery and restore; it cannot run offline.
tags: [nuget-package-update, should-not-act, license, network]
context:
  scaffold_script: place-files.sh
expected_outcome: |
  FluentAssertions is on the skill's license restrictions table as banned in all versions.
  The skill leaves it at 6.12.0, does not migrate the tests to Shouldly on its own, and flags
  it in a License Compliance section of the report with Shouldly as the recommended
  alternative. Other outdated packages are still updated.
