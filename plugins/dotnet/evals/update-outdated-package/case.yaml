schema_version: "1.1"
name: update-outdated-package
description: Needs network access to nuget.org for discovery and restore; it cannot run offline.
tags: [nuget-package-update, positive, network]
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The skill finds the outdated packages with dotnet list package --outdated, updates
  Newtonsoft.Json in src/Ledger/Ledger.csproj to the latest stable 13.0.x, builds and tests
  in Release after the group, and commits it on the checked-out deps-update branch. It does
  not create a branch, push, or open a PR, and it prints the end-of-run report.
