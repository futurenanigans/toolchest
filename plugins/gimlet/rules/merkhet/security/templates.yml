# Generic-mode rules for template languages opengrep cannot AST-parse —
# Razor (.razor, .cshtml) and Vue single-file components (.vue). Generic
# mode matches text patterns, not ASTs: less precise than TypeScript/C#
# rules but closes the coverage gap opengrep would otherwise leave.
rules:
- id: merk.security.razor-html-raw
  message: |
    @Html.Raw disables Razor's automatic HTML encoding — any user-controlled
    value rendered through it becomes live markup. Only pass pre-sanitized
    or constant content; for untrusted input use `@` (auto-encoded) or
    HtmlEncode.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.cshtml'
    - '*.razor'
  pattern: '@Html.Raw(...)'
  metadata:
    signal: xss-risk
    category: security
    cwe: CWE-79
    owasp:
    - A03:2021 — Injection
    confidence: medium
    source: ASP.NET docs — Html.Raw
