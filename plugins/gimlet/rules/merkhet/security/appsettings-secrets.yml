# Secrets checked into appsettings*.json / host.json / local.settings.json.
# Different threat model from gitleaks: gitleaks looks for high-entropy
# strings (tokens, AWS access keys); this rule flags by KEY NAME, so a
# hand-typed connection string or client secret with low-entropy content
# still fires. Empty-string values are excluded so the rule doesn't
# shout at scaffolded config templates.
#
# Generic mode over JSON — line-oriented, so multi-line nested-object
# values or commented-out keys may bypass the patterns. Pair with
# gitleaks for entropy coverage.
rules:
- id: merk.security.appsettings-connection-string
  message: |
    A ConnectionStrings entry in appsettings*.json contains a
    non-empty value. Database connection strings routinely embed
    credentials or server hostnames — neither belongs in source
    control. Move to user-secrets, environment variables, Azure Key
    Vault, or AWS Secrets Manager; leave the JSON key present with
    an empty string or remove it entirely in committed config.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - appsettings*.json
    - host.json
    - local.settings.json
  patterns:
  - pattern-either:
    - pattern: '"ConnectionString": "..."'
    - pattern: '"DefaultConnection": "..."'
  - pattern-not: '"ConnectionString": ""'
  - pattern-not: '"DefaultConnection": ""'
  metadata:
    signal: committed-secret
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: medium
    source: Microsoft docs — Safe storage of app secrets
- id: merk.security.appsettings-client-secret
  message: |
    A ClientSecret value is present in appsettings*.json. OAuth2 /
    OIDC client secrets are bearer credentials — anyone with the
    repository can impersonate the application. Move to user-secrets
    (dev), Key Vault / Secrets Manager (prod), or a managed-identity
    flow that eliminates the secret entirely.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - appsettings*.json
    - host.json
    - local.settings.json
  patterns:
  - pattern: '"ClientSecret": "..."'
  - pattern-not: '"ClientSecret": ""'
  metadata:
    signal: committed-secret
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: Microsoft docs — Safe storage of app secrets
- id: merk.security.appsettings-api-key
  message: |
    An API key is present in appsettings*.json. Third-party API keys
    are bearer credentials — access scales with the key's permissions.
    Move to user-secrets, environment variables, or a secrets manager;
    rotate the key if this commit ever reached a shared branch.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - appsettings*.json
    - host.json
    - local.settings.json
  patterns:
  - pattern-either:
    - pattern: '"ApiKey": "..."'
    - pattern: '"Apikey": "..."'
    - pattern: '"API_KEY": "..."'
  - pattern-not: '"ApiKey": ""'
  - pattern-not: '"Apikey": ""'
  - pattern-not: '"API_KEY": ""'
  metadata:
    signal: committed-secret
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: Microsoft docs — Safe storage of app secrets
- id: merk.security.appsettings-password-key
  message: |
    A *Password key holds a non-empty value in appsettings*.json.
    Passwords in source control can be reached by anyone who clones
    the repo and persist in git history after rotation. Move to
    user-secrets, environment variables, or a secrets manager.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - appsettings*.json
    - host.json
    - local.settings.json
  pattern-regex: '"\w*Password"\s*:\s*"[^"]+"'
  metadata:
    signal: committed-secret
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: medium
    source: Microsoft docs — Safe storage of app secrets
- id: merk.security.appsettings-token-key
  message: |
    A *Token key holds a non-empty value in appsettings*.json.
    Tokens in config (SAS, PAT, OAuth) grant persistent access and
    must not live in source control. Relocate to a secrets manager
    or environment-variable provider.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - appsettings*.json
    - host.json
    - local.settings.json
  pattern-regex: '"\w*Token"\s*:\s*"[^"]+"'
  metadata:
    signal: committed-secret
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: low
    source: Microsoft docs — Safe storage of app secrets
