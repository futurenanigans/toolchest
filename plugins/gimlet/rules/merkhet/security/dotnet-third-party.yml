# Third-party .NET library misconfigurations with known CVEs or documented
# security pitfalls: RestSharp header injection, Duende IdentityServer
# unhashed client secrets, and Hangfire dashboard without authorization.
rules:
- id: merk.security.restsharp-addheader-crlf-csharp
  message: |
    RestSharp AddHeader / AddOrUpdateHeader called with a non-literal
    header value. If that value is derived from user input and contains
    CR (\r) or LF (\n) characters, a remote attacker can inject
    arbitrary HTTP headers into outbound requests (CVE-2024-45302).
    Validate or sanitize the value before adding it, or use RestSharp
    >= 112.1 which rejects CRLF sequences.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: $REQ.AddHeader($K, $V)
    - pattern: $REQ.AddOrUpdateHeader($K, $V)
  - pattern-not: $REQ.AddHeader($K, "...")
  - pattern-not: $REQ.AddOrUpdateHeader($K, "...")
  metadata:
    signal: header-injection
    category: security
    cwe: CWE-93
    owasp:
    - A03:2021 — Injection
    confidence: medium
    source: CVE-2024-45302 — RestSharp CRLF injection in AddHeader
- id: merk.security.duende-secret-unhashed-csharp
  message: |
    Duende IdentityServer client secret stored as a plain string literal
    rather than a hashed value. IdentityServer compares secrets using
    SHA-256 by default — pass the literal through .Sha256() (or
    .Sha512()) so the hash (not the plaintext) is stored in the database.
    Storing plaintext means a DB read exposes the raw secret.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern: new Secret("...")
  - pattern-not: new Secret("...".Sha256())
  - pattern-not: new Secret("...".Sha512())
  metadata:
    signal: hardcoded-secret
    category: security
    cwe: CWE-798
    owasp:
    - A02:2021 — Cryptographic Failures
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: Duende IdentityServer docs — Client secrets must be hashed
- id: merk.security.hangfire-dashboard-no-auth-csharp
  message: |
    app.UseHangfireDashboard called without an Authorization filter.
    By default, Hangfire's dashboard is accessible to any user in a
    local request — in production this means any caller can view job
    queues, trigger jobs, and delete them. Pass a DashboardOptions
    with at least one IAuthorizationFilter in Authorization to restrict
    access (e.g. new[] { new HangfireCustomBasicAuthenticationFilter(...) }
    or an ASP.NET Core policy filter).
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: app.UseHangfireDashboard()
  - pattern: app.UseHangfireDashboard($ROUTE)
  - patterns:
    - pattern: |
        app.UseHangfireDashboard($ROUTE, new DashboardOptions { ... })
    - pattern-not: |
        app.UseHangfireDashboard($ROUTE, new DashboardOptions { ..., Authorization = $AUTH, ... })
  metadata:
    signal: auth-bypass
    category: security
    cwe: CWE-306
    owasp:
    - A01:2021 — Broken Access Control
    confidence: high
    source: CVE-2021-41238 — Hangfire dashboard without authorization
- id: merk.security.glimpse-diagnostics-present
  message: |
    Glimpse diagnostic package referenced in a project file. Glimpse
    exposes internal timings, SQL queries, and request/response data
    through a browser panel when enabled. Safe in dev, but the
    package shipping in a production build suggests either an
    unguarded <glimpse> element in web.config or a runtime toggle —
    either way, the panel is reachable by any caller who knows the
    URL. Drop the reference in production configurations, or gate
    the <glimpse> element with <location> + build configuration.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.csproj'
    - packages.config
  pattern-either:
  - pattern: '"Glimpse" '
  - pattern: '"Glimpse."'
  - pattern: Include="Glimpse
  metadata:
    signal: diagnostics-in-prod
    category: security
    cwe: CWE-200
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: low
    source: Glimpse docs — production-safe configuration
- id: merk.security.rhino-mocks-in-production
  message: |
    Rhino.Mocks is an abandoned mocking framework (last release
    2013). Presence as a non-test <PackageReference> or
    packages.config entry is almost always a forgotten dependency —
    production code should not depend on a mocking library. Confirm
    by checking whether the project is a test project (framework
    package like xunit/nunit/mstest); if it is, the warning is a
    false positive for the project type.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.csproj'
    - packages.config
  pattern-either:
  - pattern: '"RhinoMocks"'
  - pattern: '"Rhino.Mocks"'
  - pattern: Include="RhinoMocks
  - pattern: Include="Rhino.Mocks
  metadata:
    signal: deprecated-package
    category: security
    cwe: CWE-1329
    owasp:
    - A06:2021 — Vulnerable and Outdated Components
    confidence: low
    source: Rhino.Mocks — abandoned since 2013
- id: merk.security.moq-sponsor-link
  message: |
    Moq >= 4.20.0 ships the SponsorLink telemetry component that
    extracts the user's email from git config and transmits it to
    a third-party service. Pin Moq to < 4.20.0 (4.18.x is a
    common last-safe version) until the telemetry is fully
    removed — or switch to NSubstitute / FakeItEasy.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.csproj'
    - packages.config
  pattern-either:
  - pattern: Include="Moq" Version="4.20
  - pattern: Include="Moq" Version="4.21
  - pattern: Include="Moq" Version="4.22
  - pattern: Include="Moq" Version="4.23
  - pattern: Include="Moq" Version="4.24
  metadata:
    signal: telemetry-package
    category: security
    cwe: CWE-359
    owasp:
    - A06:2021 — Vulnerable and Outdated Components
    confidence: high
    source: 'Moq 4.20 SponsorLink incident — devblogs.github issue #1384'
