# Legacy ASP.NET Forms Authentication — persistent tickets issued over
# HTTP, cookies without requireSSL, or long ticket timeouts. Each
# shape lets an attacker who captures a cookie (or steals one via XSS)
# impersonate the user until the ticket expires.
rules:
- id: merk.security.forms-auth-persistent-ticket-csharp
  message: |
    FormsAuthenticationTicket issued with isPersistent: true pins a
    long-lived cookie to the browser — the user stays signed in
    across browser restarts, and any cookie capture persists for
    the ticket's lifetime. Consider issuing short-lived session
    tickets (isPersistent: false) and rely on a refresh flow, or
    shorten the timeout to minutes rather than days.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: new FormsAuthenticationTicket($V, $U, $I, $T, true, ...)
    - pattern: new System.Web.Security.FormsAuthenticationTicket($V, $U, $I, $T, true, ...)
  metadata:
    signal: forms-auth-weak
    category: security
    cwe: CWE-613
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: low
    source: Microsoft docs — FormsAuthenticationTicket
- id: merk.security.forms-auth-cookie-not-ssl
  message: |
    <forms requireSSL="false"> — or an absent requireSSL attribute,
    which defaults false — sends the .ASPXAUTH cookie over plain HTTP.
    An attacker on the same network captures the cookie and signs in
    as the user. Set requireSSL="true" and match the setting in
    <httpCookies> so every auth-related cookie is HTTPS-only.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: <forms ... requireSSL="false" ...>
  - pattern: <forms ... requireSSL='false' ...>
  metadata:
    signal: forms-auth-weak
    category: security
    cwe: CWE-614
    owasp:
    - A02:2021 — Cryptographic Failures
    confidence: medium
    source: Microsoft docs — forms element
- id: merk.security.forms-auth-cookieless-csharp
  message: |
    <forms cookieless="UseUri"> embeds the auth ticket in the URL —
    any Referer header, bookmark, or log line leaks an authenticated
    session token. Use cookieless="UseCookies" (the secure default)
    and pair with requireSSL="true".
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: cookieless="UseUri"
  - pattern: cookieless='UseUri'
  - pattern: cookieless="AutoDetect"
  - pattern: cookieless='AutoDetect'
  metadata:
    signal: forms-auth-weak
    category: security
    cwe: CWE-598
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: Microsoft docs — forms.cookieless
