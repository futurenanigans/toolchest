# Cryptographic failures — broken algorithms, insecure modes, and
# predictable randomness used in security contexts. These are pattern
# matches on construction/invocation sites; they fire without taint
# because the APIs themselves are the problem.
rules:
- id: merk.security.weak-hash-csharp
  message: |
    MD5 and SHA1 are cryptographically broken. Use SHA256 or SHA512 for
    security-sensitive hashing (signatures, HMAC keys, integrity of
    untrusted data). Acceptable only for non-security checksums.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: MD5.Create()
  - pattern: SHA1.Create()
  - pattern: new MD5CryptoServiceProvider()
  - pattern: new SHA1CryptoServiceProvider()
  - pattern: new MD5Managed()
  - pattern: new SHA1Managed()
  - pattern: HashAlgorithm.Create("MD5")
  - pattern: HashAlgorithm.Create("SHA1")
  - pattern: HashAlgorithm.Create("SHA-1")
  metadata:
    signal: weak-crypto
    category: security
    cwe: CWE-327
    owasp:
    - A02:2021 — Cryptographic Failures
    confidence: medium
    source: OWASP A02:2021 — Cryptographic Failures (CWE-327)
- id: merk.security.weak-cipher-csharp
  message: |
    DES, 3DES, and RC2 are deprecated ciphers. DES has a 56-bit key
    (breakable), RC2 has known weaknesses, and 3DES is being retired
    by NIST. Use AES (preferably AES-GCM) or ChaCha20-Poly1305.
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: DES.Create(...)
  - pattern: TripleDES.Create(...)
  - pattern: RC2.Create(...)
  - pattern: new DESCryptoServiceProvider()
  - pattern: new TripleDESCryptoServiceProvider()
  - pattern: new RC2CryptoServiceProvider()
  metadata:
    signal: weak-crypto
    category: security
    cwe: CWE-327
    owasp:
    - A02:2021 — Cryptographic Failures
    confidence: high
    source: NIST SP 800-131A — Transitioning the Use of Cryptographic Algorithms
- id: merk.security.ecb-mode-csharp
  message: |
    ECB mode encrypts each block independently, so identical plaintext
    blocks produce identical ciphertext — patterns leak. Use an
    authenticated mode (AES-GCM, ChaCha20-Poly1305) or at minimum
    CBC/CTR with a fresh IV per message and a separate MAC.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: $X.Mode = CipherMode.ECB
  - pattern: |
      $X.EncryptEcb(...)
  - pattern: |
      $X.DecryptEcb(...)
  metadata:
    signal: weak-crypto
    category: security
    cwe: CWE-327
    owasp:
    - A02:2021 — Cryptographic Failures
    confidence: high
    source: OWASP Cryptographic Storage Cheat Sheet — Cipher Modes
- id: merk.security.insecure-randomness-csharp
  message: |
    System.Random is a linear-congruential PRNG — state is recoverable
    from a short output sequence. Use RandomNumberGenerator (or the
    static Create()) for tokens, keys, nonces, salts, or anything an
    attacker might predict.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: new Random()
  - pattern: new Random($SEED)
  metadata:
    signal: insecure-randomness
    category: security
    cwe: CWE-338
    owasp:
    - A02:2021 — Cryptographic Failures
    confidence: low
    source: .NET docs — RandomNumberGenerator (use for cryptographic randomness)
