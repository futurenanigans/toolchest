# Server-Side Request Forgery — HTTP client invoked with a URL derived
# from the HTTP request. Attackers use SSRF to reach internal services
# (cloud metadata endpoints at 169.254.169.254, localhost admin ports,
# RFC1918 networks). Taint-tracked intra-file: request-derived values
# into fetch/axios/HttpClient sinks, with common URL-allowlist helpers
# as sanitizers.
rules:
- id: merk.security.ssrf-csharp
  message: |
    HTTP client targets a URL derived from the HTTP request. An
    attacker can redirect the server to internal services (cloud
    metadata, localhost, private ranges). Validate the URL against
    a host allowlist via `Uri.IsWellFormedUriString` +
    `uri.Host == expected` or an `HttpClient` wrapper that rejects
    private IPs.
  severity: WARNING
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - pattern: $REQ.Query[...]
  - pattern: $REQ.Form[...]
  - pattern: $REQ.Headers[...]
  - pattern: $REQ.Cookies[...]
  - pattern: $REQ.RouteValues[...]
  - pattern: $REQ.QueryString[...]
  - pattern: $REQ.Params[...]
  - patterns:
    - pattern-either:
      - pattern-inside: $T $M(..., [FromQuery] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromRoute] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromBody] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromForm] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromHeader] $PT $X, ...) {...}
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromBody] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromForm] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => $E
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => $E
      - pattern-inside: (..., [FromBody] $PT $X, ...) => $E
      - pattern-inside: (..., [FromForm] $PT $X, ...) => $E
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => $E
    - focus-metavariable: $X
    - pattern: $X
  pattern-sinks:
  - pattern: $CLIENT.GetAsync($X)
  - pattern: $CLIENT.GetAsync($X, $Y)
  - pattern: $CLIENT.GetStringAsync($X)
  - pattern: $CLIENT.GetByteArrayAsync($X)
  - pattern: $CLIENT.GetStreamAsync($X)
  - pattern: $CLIENT.PostAsync($X, $Y)
  - pattern: $CLIENT.PutAsync($X, $Y)
  - pattern: $CLIENT.DeleteAsync($X)
  - pattern: $CLIENT.PatchAsync($X, $Y)
  - pattern: $CLIENT.SendAsync(new HttpRequestMessage($M, $X))
  - pattern: WebRequest.Create($X)
  - pattern: HttpWebRequest.Create($X)
  - pattern: new WebClient().DownloadString($X)
  - pattern: new WebClient().DownloadData($X)
  - pattern: new WebClient().DownloadFile($X, $Y)
  - pattern: new WebClient().OpenRead($X)
  - pattern: $WC.OpenRead($X)
  pattern-sanitizers:
  - pattern: AllowedHosts.Contains($X)
  - pattern: $ALLOW.Contains($X)
  - pattern: UrlValidator.Validate($X)
  metadata:
    signal: ssrf
    category: security
    cwe: CWE-918
    owasp:
    - A10:2021 — Server-Side Request Forgery
    confidence: high
    source: OWASP A10:2021 — Server-Side Request Forgery (taint-tracked)
