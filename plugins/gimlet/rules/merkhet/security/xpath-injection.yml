# XPath injection — XPath expressions reached by request-derived input
# without escaping. Like SQL injection, attacker input can reshape the
# query structure (`' or '1'='1`). Taint-tracked intra-file.
rules:
- id: merk.security.xpath-injection-csharp
  message: |
    XPath expression reached by a value derived from the HTTP
    request. Attacker input can bypass authentication or extract
    unintended nodes. Use XPath variables via `XsltArgumentList` +
    `XPathExpression.SetContext` (with an `XsltContext` that binds
    parameters), or escape single quotes with a well-tested helper
    before embedding.
  severity: ERROR
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - pattern: $REQ.Query[...]
  - pattern: $REQ.Form[...]
  - pattern: $REQ.Headers[...]
  - pattern: $REQ.Cookies[...]
  - pattern: $REQ.RouteValues[...]
  - pattern: $REQ.QueryString[...]
  - pattern: $REQ.Params[...]
  - patterns:
    - pattern-either:
      - pattern-inside: $T $M(..., [FromQuery] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromRoute] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromBody] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromForm] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromHeader] $PT $X, ...) {...}
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromBody] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromForm] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => $E
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => $E
      - pattern-inside: (..., [FromBody] $PT $X, ...) => $E
      - pattern-inside: (..., [FromForm] $PT $X, ...) => $E
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => $E
    - focus-metavariable: $X
    - pattern: $X
  pattern-sinks:
  - pattern: $NAV.Evaluate($X, ...)
  - pattern: $NODE.SelectNodes($X)
  - pattern: $NODE.SelectSingleNode($X)
  - pattern: XPathExpression.Compile($X)
  pattern-sanitizers:
  - pattern: $ENC.XPathEscape($X)
  - pattern: XPathEscape($X)
  metadata:
    signal: xpath-injection
    category: security
    cwe: CWE-643
    owasp:
    - A03:2021 — Injection
    confidence: high
    source: OWASP XPath Injection (A03:2021 — Injection, taint-tracked)
