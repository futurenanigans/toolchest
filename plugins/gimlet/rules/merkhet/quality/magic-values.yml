# Magic values — hardcoded URLs, ports, timeouts, and connection strings
# inline in source. These are maintainability hazards: they scatter
# configuration across call sites, mask environment differences, and
# block testing (no way to substitute a value).
rules:
- id: merk.quality.magic-url-csharp
  message: |
    Hardcoded HTTP(S) URL embedded inline. Move external URLs to
    IConfiguration / appsettings.json / IOptions<T> so environments
    can differ and tests can substitute. Exception: documentation
    strings, schema URLs, error messages referencing standards.
  severity: INFO
  languages:
  - csharp
  patterns:
  - pattern: |
      "$URL"
  - metavariable-regex:
      metavariable: $URL
      regex: ^https?:\/\/(?!(?:localhost|127\.0\.0\.1|0\.0\.0\.0|schemas?\.|www\.w3\.org|json-schema\.org|example\.(?:com|org|net)))[a-zA-Z0-9][^\s"']{3,}$
  metadata:
    signal: magic-value
    category: quality
    confidence: low
    source: Microsoft — Configuration in ASP.NET Core (IOptions pattern)
- id: merk.quality.magic-connection-string-csharp
  message: |
    Connection string literal inline — credentials, server names, and
    catalog names should come from IConfiguration / user-secrets /
    key-vault. Inline strings leak to source control and can't vary
    per environment.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern: |
      "$CS"
  - metavariable-regex:
      metavariable: $CS
      regex: ^(?i:(?:Server|Data Source|Host|Initial Catalog|Database|UID|User Id|Password|Pwd)\s*=.*;.*)
  metadata:
    signal: magic-value
    category: quality
    confidence: medium
    source: Microsoft — safe storage of app secrets
