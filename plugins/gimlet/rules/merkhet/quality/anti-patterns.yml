# Code-quality anti-patterns. Lower-confidence than security findings;
# weighted at 0.8× (spec Phase 5). Opt in via `.healthrc.json` —
# `opengrep.categories: ["security", "quality"]` — not loaded by default.
#
# Seed rules demonstrate the scaffolding. Teams extend with org-specific
# anti-patterns (e.g., banned imports, deprecated helper functions).
rules:
- id: merk.quality.swallowed-error-csharp
  message: |
    Empty catch block silently discards the exception. At minimum log it
    (with context), and prefer propagating, wrapping, or explicitly
    handling the specific exception type. Silent catches make production
    failures invisible.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: |
      try { ... } catch { }
  - pattern: |
      try { ... } catch ($T) { }
  - pattern: |
      try { ... } catch ($T $E) { }
  metadata:
    signal: swallowed-error
    category: quality
    confidence: high
    source: CWE-390 — Detection of Error Condition Without Action
