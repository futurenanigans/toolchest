# Error-handling gaps — patterns where failures are silently dropped or
# rethrown without context. Complements quality/anti-patterns.yml
# (empty-catch) with the harder-to-spot variants: swallowed promise
# rejections, catch-and-ignore, rethrow without chain.
rules:
- id: merk.quality.rethrow-loses-stack-csharp
  message: |
    `throw ex;` inside a catch resets the stack trace to the throw
    site, erasing the original frames. Use a bare `throw;` to
    preserve the inner stack, or wrap with `throw new X("...",
    innerException: ex)`.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern: |
      try { ... } catch ($T $E) { ... throw $E; }
  - pattern-not: |
      try { ... } catch ($T $E) { ... throw new $NEW(..., $E); }
  metadata:
    signal: error-handling-gap
    category: quality
    confidence: high
    source: .NET docs — throw vs throw ex preserves stack trace
- id: merk.quality.catch-general-exception-csharp
  message: |
    Catching the bare `Exception` type swallows every failure mode
    — including programmer errors (NullReferenceException,
    ArgumentException) that should bubble up as bugs. Catch the
    specific exception types you can actually recover from.
  severity: INFO
  languages:
  - csharp
  patterns:
  - pattern: |
      try { ... } catch (Exception $E) { ... }
  - pattern-not: |
      try { ... } catch (Exception $E) { ... throw; }
  - pattern-not: |
      try { ... } catch (Exception $E) { ... throw new $NEW(..., $E); }
  metadata:
    signal: error-handling-gap
    category: quality
    confidence: low
    source: Framework Design Guidelines — avoid catching Exception
