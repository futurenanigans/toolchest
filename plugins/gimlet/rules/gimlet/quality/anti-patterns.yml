rules:
- id: gimlet.quality.swallowed-error-csharp
  message: |
    Empty catch block silently discards the exception. At minimum log it
    (with context), and prefer propagating, wrapping, or explicitly
    handling the specific exception type. Silent catches make production
    failures invisible.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: |
      try { ... } catch { }
  - pattern: |
      try { ... } catch ($T) { }
  - pattern: |
      try { ... } catch ($T $E) { }
  metadata:
    category: quality
    confidence: high
    source: CWE-390 — Detection of Error Condition Without Action
