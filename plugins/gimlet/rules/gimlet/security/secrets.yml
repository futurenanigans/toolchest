rules:
- id: gimlet.security.hardcoded-credential-assignment-csharp
  message: |
    Credential-named field or property initialized to a non-empty string
    literal. Load the value from IConfiguration, environment variables, or
    a secret manager (Azure Key Vault, AWS Secrets Manager).
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: const string $NAME = "...";
    - pattern: private const string $NAME = "...";
    - pattern: public const string $NAME = "...";
    - pattern: internal const string $NAME = "...";
    - pattern: private static readonly string $NAME = "...";
    - pattern: private static string $NAME = "...";
    - pattern: string $NAME = "...";
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i)^(_?(api[_]?key|secret|password|pwd|token|auth[_]?token|access[_]?token|private[_]?key|connection[_]?string))$
  - pattern-not: const string $NAME = "";
  - pattern-not: private const string $NAME = "";
  - pattern-not: public const string $NAME = "";
  - pattern-not: internal const string $NAME = "";
  - pattern-not: private static readonly string $NAME = "";
  - pattern-not: private static string $NAME = "";
  - pattern-not: string $NAME = "";
  metadata:
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: CWE-798 — Use of Hard-coded Credentials
- id: gimlet.security.connection-string-with-password
  message: |
    Connection string contains an embedded password. Store the full
    connection string in a secret manager, or compose it at runtime from
    separate configuration values.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: |
        "$STR"
    - pattern: |
        @"$STR"
  - metavariable-regex:
      metavariable: $STR
      regex: (?i).*(password|pwd)\s*=\s*[^;\s"\$\{][^;\"]+.*
  metadata:
    category: security
    cwe: CWE-798
    owasp:
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: CWE-798 — Use of Hard-coded Credentials
