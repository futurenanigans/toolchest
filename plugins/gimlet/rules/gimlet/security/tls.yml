rules:
- id: gimlet.security.tls-servicepoint-always-trust-csharp
  message: |
    ServicePointManager.ServerCertificateValidationCallback is set to
    a lambda that unconditionally returns true: every TLS certificate
    is trusted, including attacker-controlled ones. Remove the
    callback override or implement a pinning check against expected
    issuer/thumbprint.
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: ServicePointManager.ServerCertificateValidationCallback = (...) => true
  - pattern: ServicePointManager.ServerCertificateValidationCallback = delegate { return true; }
  - pattern: |
      ServicePointManager.ServerCertificateValidationCallback = ($A, $B, $C, $D) => true;
  - pattern: |
      ServicePointManager.ServerCertificateValidationCallback += ($A, $B, $C, $D) => true;
  metadata:
    category: security
    cwe: CWE-295
    owasp:
    - A02:2021-Cryptographic Failures
    confidence: high
    source: MSFT, ServicePointManager.ServerCertificateValidationCallback security
- id: gimlet.security.tls-httpclienthandler-always-trust-csharp
  message: |
    HttpClientHandler.ServerCertificateCustomValidationCallback
    configured to always return true accepts any certificate. The
    HttpClient built on this handler has no TLS protection against
    MITM. Remove the override or implement proper validation.
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: |
      new HttpClientHandler { ..., ServerCertificateCustomValidationCallback = (...) => true, ... }
  - pattern: |
      new HttpClientHandler { ..., ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator, ... }
  - pattern: |
      $H.ServerCertificateCustomValidationCallback = (...) => true;
  - pattern: |
      $H.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator;
  metadata:
    category: security
    cwe: CWE-295
    owasp:
    - A02:2021-Cryptographic Failures
    confidence: high
    source: MSFT, HttpClientHandler.ServerCertificateCustomValidationCallback
