rules:
- id: gimlet.security.auth-missing-authorize-csharp
  message: |
    MVC/API controller has no [Authorize] or [AllowAnonymous] attribute
    — by default it accepts unauthenticated requests unless a global
    filter is in place. Apply [Authorize] at the class level (with
    per-action [AllowAnonymous] where needed) to make access explicit.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: |
        public class $CLASS : Controller { ... }
    - pattern: |
        public class $CLASS : ControllerBase { ... }
  - pattern-not: |
      [Authorize]
      public class $CLASS : $BASE { ... }
  - pattern-not: |
      [Authorize(...)]
      public class $CLASS : $BASE { ... }
  - pattern-not: |
      [AllowAnonymous]
      public class $CLASS : $BASE { ... }
  - pattern-not: |
      [ApiController]
      [Authorize]
      public class $CLASS : $BASE { ... }
  - pattern-not: |
      [Authorize]
      [ApiController]
      public class $CLASS : $BASE { ... }
  - pattern-not: |
      [Route(...)]
      [Authorize]
      public class $CLASS : $BASE { ... }
  metadata:
    category: security
    cwe: CWE-862
    owasp:
    - A01:2021 — Broken Access Control
    - A07:2021 — Identification and Authentication Failures
    confidence: low
    source: ASP.NET Core — Authorization is opt-in per controller without global filter
- id: gimlet.security.auth-jwt-skip-signature-validation-csharp
  message: |
    TokenValidationParameters.ValidateSignatureLast / RequireSignedTokens
    = false (or ValidateIssuerSigningKey = false) disables JWT signature
    verification. Any attacker can forge a token. Keep signature,
    issuer, audience, and lifetime validation enabled.
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: |
      new TokenValidationParameters { ..., RequireSignedTokens = false, ... }
  - pattern: |
      new TokenValidationParameters { ..., ValidateIssuerSigningKey = false, ... }
  - pattern: |
      new TokenValidationParameters { ..., ValidateIssuer = false, ..., ValidateAudience = false, ... }
  - pattern: |
      $OPTS.RequireSignedTokens = false;
  - pattern: |
      $OPTS.ValidateIssuerSigningKey = false;
  metadata:
    category: security
    cwe: CWE-287
    owasp:
    - A01:2021 — Broken Access Control
    - A07:2021 — Identification and Authentication Failures
    confidence: medium
    source: MSFT — TokenValidationParameters security remarks
- id: gimlet.security.auth-jwt-skip-lifetime-validation-csharp
  message: |
    TokenValidationParameters.ValidateLifetime = false (or
    RequireExpirationTime = false) disables expiry checks — a leaked
    token stays valid indefinitely. Keep lifetime validation enabled
    and ensure tokens are issued with a short `exp` claim.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: |
        new TokenValidationParameters { ..., ValidateLifetime = false, ... }
    - pattern: |
        new TokenValidationParameters { ..., RequireExpirationTime = false, ... }
    - pattern: |
        $OPTS.ValidateLifetime = false;
    - pattern: |
        $OPTS.RequireExpirationTime = false;
  metadata:
    category: security
    cwe: CWE-613
    owasp:
    - A01:2021 — Broken Access Control
    - A07:2021 — Identification and Authentication Failures
    confidence: high
    source: MSFT — TokenValidationParameters.ValidateLifetime
