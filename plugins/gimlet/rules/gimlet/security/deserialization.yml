rules:
- id: gimlet.security.insecure-deserialization-binaryformatter-csharp
  message: |
    BinaryFormatter cannot be made safe for untrusted input: an
    attacker-crafted payload can drive arbitrary type construction and
    execute gadgets (YSoSerial.Net). Microsoft has formally deprecated
    it. Migrate to System.Text.Json or a contract-based serializer
    (DataContractSerializer with a KnownTypes allowlist).
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: new BinaryFormatter()
  - pattern: new BinaryFormatter(...)
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: high
    source: MSFT, BinaryFormatter security guide (deprecated, insecure)
- id: gimlet.security.insecure-deserialization-losformatter-csharp
  message: |
    LosFormatter / ObjectStateFormatter / SoapFormatter are all unsafe
    for untrusted input, the same polymorphic gadget risk as
    BinaryFormatter. Use a schema-based serializer instead.
  severity: ERROR
  languages:
  - csharp
  pattern-either:
  - pattern: new LosFormatter()
  - pattern: new ObjectStateFormatter()
  - pattern: new SoapFormatter()
  - pattern: new NetDataContractSerializer()
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: high
    source: MSFT, Data contract serializer security
- id: gimlet.security.insecure-deserialization-newtonsoft-typenamehandling-csharp
  message: |
    Newtonsoft.Json with TypeNameHandling != None embeds CLR type names
    in the payload, so deserializing untrusted JSON can instantiate any
    type and invoke its setters/constructors (arbitrary code execution
    via gadget chains). Use TypeNameHandling.None (the default) or bind
    a custom SerializationBinder that allowlists expected types.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: TypeNameHandling = TypeNameHandling.All
    - pattern: TypeNameHandling = TypeNameHandling.Auto
    - pattern: TypeNameHandling = TypeNameHandling.Objects
    - pattern: TypeNameHandling = TypeNameHandling.Arrays
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: medium
    source: Newtonsoft.Json, TypeNameHandling security remarks
- id: gimlet.security.insecure-deserialization-javascript-serializer-csharp
  message: |
    JavaScriptSerializer with a SimpleTypeResolver enables polymorphic
    deserialization, the same class of vulnerability as unsafe
    Newtonsoft.Json. Drop the resolver or move to System.Text.Json.
  severity: ERROR
  languages:
  - csharp
  pattern: new JavaScriptSerializer(new SimpleTypeResolver())
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: high
    source: MSFT, JavaScriptSerializer is deprecated (use System.Text.Json)
- id: gimlet.security.insecure-deserialization-newtonsoft-no-binder-csharp
  message: |
    JsonSerializerSettings with TypeNameHandling set to a non-None value
    but without a SerializationBinder provides no defense against gadget-
    chain attacks: any CLR type can be instantiated from the payload.
    Add a SerializationBinder that allowlists expected types, or switch
    TypeNameHandling back to None.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: |
        new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.All, ... }
    - pattern: |
        new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Auto, ... }
    - pattern: |
        new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Objects, ... }
    - pattern: |
        new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Arrays, ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.All, ..., SerializationBinder = ..., ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Auto, ..., SerializationBinder = ..., ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Objects, ..., SerializationBinder = ..., ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., TypeNameHandling = TypeNameHandling.Arrays, ..., SerializationBinder = ..., ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., SerializationBinder = ..., ..., TypeNameHandling = TypeNameHandling.All, ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., SerializationBinder = ..., ..., TypeNameHandling = TypeNameHandling.Auto, ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., SerializationBinder = ..., ..., TypeNameHandling = TypeNameHandling.Objects, ... }
  - pattern-not: |
      new JsonSerializerSettings { ..., SerializationBinder = ..., ..., TypeNameHandling = TypeNameHandling.Arrays, ... }
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: high
    source: MSFT, Newtonsoft SerializationBinder mitigations
- id: gimlet.security.datacontract-knowntypes-csharp
  message: |
    DataContractSerializer constructed with a knownTypes array, or
    a [KnownType] attribute on a type that gets deserialized from
    untrusted input, widens the gadget surface. Any type listed,
    or reachable through reflection from a listed type, can be
    instantiated by a crafted payload. Drop [KnownType] / knownTypes
    for types that cross an untrusted boundary; deserialize into a
    sealed contract and do the type discrimination yourself.
  severity: WARNING
  languages:
  - csharp
  pattern-either:
  - pattern: new DataContractSerializer($T, new[] { ... })
  - pattern: new DataContractSerializer($T, new Type[] { ... })
  - pattern: new DataContractSerializer($T, $KTS, ...)
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: low
    source: Microsoft docs, DataContractSerializer KnownTypes
- id: gimlet.security.datacontract-knowntype-attribute-csharp
  message: |
    [KnownType(typeof(X))] attribute on a type that gets
    deserialized from untrusted input widens the gadget surface.
    Attackers can submit a payload that instantiates any listed
    type. Remove [KnownType] from types crossing an untrusted
    boundary; do type discrimination in explicit code paths
    instead.
  severity: WARNING
  languages:
  - csharp
  pattern-regex: \[\s*KnownType\s*\(\s*typeof\s*\(
  metadata:
    category: security
    cwe: CWE-502
    owasp:
    - A08:2021-Software and Data Integrity Failures
    confidence: low
    source: Microsoft docs, DataContractSerializer KnownTypes
