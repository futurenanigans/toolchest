rules:
- id: gimlet.security.swagger-in-prod-csharp
  message: |
    app.UseSwagger / app.UseSwaggerUI called outside an IsDevelopment()
    guard. Swagger exposes every endpoint, parameter, and schema to
    unauthenticated callers in production. Wrap both calls inside
    `if (app.Environment.IsDevelopment()) { ... }` or disable them
    via a feature flag before deploying.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: app.UseSwagger(...)
    - pattern: app.UseSwaggerUI(...)
  - pattern-not-inside: |
      if (app.Environment.IsDevelopment()) { ... }
  - pattern-not-inside: |
      if ($ENV.IsDevelopment()) { ... }
  metadata:
    category: security
    cwe: CWE-200
    owasp:
    - A05:2021-Security Misconfiguration
    confidence: high
    source: Microsoft, Swagger security in production
- id: gimlet.security.developer-exception-page-in-prod-csharp
  message: |
    app.UseDeveloperExceptionPage() called outside an IsDevelopment()
    guard. The developer exception page renders full stack traces,
    query strings, and request headers to any caller; never enable it
    in production. Wrap it inside `if (app.Environment.IsDevelopment())`.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: app.UseDeveloperExceptionPage(...)
  - pattern-not-inside: |
      if (app.Environment.IsDevelopment()) { ... }
  - pattern-not-inside: |
      if ($ENV.IsDevelopment()) { ... }
  metadata:
    category: security
    cwe: CWE-209
    owasp:
    - A05:2021-Security Misconfiguration
    confidence: high
    source: ASP.NET Core docs, UseDeveloperExceptionPage is development-only
