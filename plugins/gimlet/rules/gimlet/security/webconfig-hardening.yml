rules:
- id: gimlet.security.webconfig-debug-compilation
  message: |
    <compilation debug="true"> in web.config emits debug symbols and
    disables request caching / batch compilation. Stack traces in
    error pages reveal source paths; the server is also markedly
    slower. Ship production releases with debug="false" (or scrubbed
    from web.config entirely).
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: debug="true"
  - pattern: debug='true'
  metadata:
    category: security
    cwe: CWE-489
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: medium
    source: Microsoft docs — compilation element (ASP.NET)
- id: gimlet.security.webconfig-custom-errors-off
  message: |
    <customErrors mode="Off"> shows full YSOD error pages to every
    caller — stack traces, source file paths, and inner exception
    chains are exposed. Set mode="RemoteOnly" for ops access or
    mode="On" to hide them entirely; pair with a <defaultRedirect>
    for a user-friendly error page.
  severity: ERROR
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: mode="Off"
  - pattern: mode='Off'
  metadata:
    category: security
    cwe: CWE-209
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: medium
    source: Microsoft docs — customErrors element (ASP.NET)
- id: gimlet.security.webconfig-request-validation-legacy
  message: |
    <httpRuntime requestValidationMode="2.0"> reverts ASP.NET's built-in
    XSS request validation to the pre-4.0 behavior — attribute and
    header payloads that 4.x+ would reject are accepted silently.
    Remove the override (default is 4.0+) unless a specific endpoint
    requires it; scope narrow overrides via <location path>.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: requestValidationMode="2.0"
  - pattern: requestValidationMode='2.0'
  metadata:
    category: security
    cwe: CWE-20
    owasp:
    - A03:2021 — Injection
    confidence: high
    source: Microsoft docs — httpRuntime.requestValidationMode
- id: gimlet.security.webconfig-trace-enabled
  message: |
    <trace enabled="true"> exposes /trace.axd with per-request headers,
    cookies, server variables, and session state. Set enabled="false"
    and remove any <location> overrides that re-enable it, or delete
    the entire <trace> element for production configurations.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern: <trace enabled="true"
  metadata:
    category: security
    cwe: CWE-200
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: high
    source: Microsoft docs — trace element (ASP.NET)
- id: gimlet.security.webconfig-cookies-not-ssl
  message: |
    <httpCookies requireSSL="false"> — or the implicit default —
    allows session cookies over plain HTTP. An attacker on the same
    network can capture the cookie and impersonate the user. Set
    requireSSL="true" and also enable httpOnlyCookies="true" to block
    XSS cookie theft.
  severity: WARNING
  languages:
  - generic
  paths:
    include:
    - '*.config'
  pattern-either:
  - pattern: requireSSL="false"
  - pattern: requireSSL='false'
  metadata:
    category: security
    cwe: CWE-614
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: medium
    source: Microsoft docs — httpCookies element
