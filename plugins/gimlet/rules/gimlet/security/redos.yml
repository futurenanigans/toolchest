rules:
- id: gimlet.security.regex-no-timeout-csharp
  message: |
    Regex on potentially untrusted input without a Timeout argument.
    A crafted input that triggers catastrophic backtracking can pin
    a worker thread. Pass a TimeSpan timeout as the final argument,
    or set a global default via AppContext/SetMatchTimeout at app
    startup.
  severity: INFO
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: Regex.Match($X, $P)
    - pattern: Regex.Match($X, $P, $O)
    - pattern: Regex.Matches($X, $P)
    - pattern: Regex.Matches($X, $P, $O)
    - pattern: Regex.IsMatch($X, $P)
    - pattern: Regex.IsMatch($X, $P, $O)
    - pattern: Regex.Replace($X, $P, $R)
    - pattern: Regex.Replace($X, $P, $R, $O)
    - pattern: Regex.Split($X, $P)
    - pattern: Regex.Split($X, $P, $O)
    - pattern: new Regex($P)
    - pattern: new Regex($P, $O)
  metadata:
    category: security
    cwe: CWE-1333
    owasp:
    - A05:2021 — Security Misconfiguration
    confidence: low
    source: 'MSFT — Regex best practices: always specify a timeout'
