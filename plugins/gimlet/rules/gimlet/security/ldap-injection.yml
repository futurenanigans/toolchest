rules:
- id: gimlet.security.ldap-injection-csharp
  message: |
    LDAP filter reached by a value derived from the HTTP request.
    Special characters (*, (, ), \, NUL) can reshape the query and
    bypass authentication checks. Encode with
    `Encoder.LdapFilterEncode` / `LdapDistinguishedNameEncode`
    (from System.Security.AntiXss or OWASP ESAPI) before composing
    the filter string.
  severity: ERROR
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - pattern: $REQ.Query[...]
  - pattern: $REQ.Form[...]
  - pattern: $REQ.Headers[...]
  - pattern: $REQ.Cookies[...]
  - pattern: $REQ.RouteValues[...]
  - pattern: $REQ.QueryString[...]
  - pattern: $REQ.Params[...]
  - patterns:
    - pattern-either:
      - pattern-inside: $T $M(..., [FromQuery] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromRoute] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromBody] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromForm] $PT $X, ...) {...}
      - pattern-inside: $T $M(..., [FromHeader] $PT $X, ...) {...}
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromBody] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromForm] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => { ... }
      - pattern-inside: (..., [FromQuery] $PT $X, ...) => $E
      - pattern-inside: (..., [FromRoute] $PT $X, ...) => $E
      - pattern-inside: (..., [FromBody] $PT $X, ...) => $E
      - pattern-inside: (..., [FromForm] $PT $X, ...) => $E
      - pattern-inside: (..., [FromHeader] $PT $X, ...) => $E
    - focus-metavariable: $X
    - pattern: $X
  pattern-sinks:
  - pattern: $S.Filter = $X
  - pattern: new DirectorySearcher($DN, $X)
  - pattern: new DirectorySearcher($DN, $X, $Y)
  - pattern: new DirectorySearcher($DN, $X, $Y, $Z)
  pattern-sanitizers:
  - pattern: $ENC.LdapFilterEncode($X)
  - pattern: $ENC.LdapDistinguishedNameEncode($X)
  - pattern: Encoder.LdapFilterEncode($X)
  - pattern: Encoder.LdapDistinguishedNameEncode($X)
  - pattern: Regex.Replace($X, ...)
  metadata:
    category: security
    cwe: CWE-90
    owasp:
    - A03:2021 — Injection
    confidence: high
    source: OWASP LDAP Injection Prevention Cheat Sheet (taint-tracked)
