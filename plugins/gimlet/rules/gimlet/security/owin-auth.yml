rules:
- id: gimlet.security.owin-oidc-validate-issuer-disabled-csharp
  message: |
    TokenValidationParameters.ValidateIssuer = false on
    UseOpenIdConnectAuthentication accepts tokens from any issuer.
    An attacker who can mint a JWT (any IDP they control) is
    authenticated as the requested user. Set ValidateIssuer = true
    and pin ValidIssuer to the expected authority URL.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: ValidateIssuer = false
  - pattern-inside: |
      $APP.UseOpenIdConnectAuthentication(new OpenIdConnectAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-345
    owasp:
    - A07:2021-Identification and Authentication Failures
    confidence: high
    source: Microsoft docs, TokenValidationParameters
- id: gimlet.security.owin-oidc-validate-audience-disabled-csharp
  message: |
    TokenValidationParameters.ValidateAudience = false on
    UseOpenIdConnectAuthentication accepts tokens minted for any
    application. A token issued for another app in the same tenant
    is accepted as if it were issued for yours. Set
    ValidateAudience = true and pin ValidAudience to your client ID.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: ValidateAudience = false
  - pattern-inside: |
      $APP.UseOpenIdConnectAuthentication(new OpenIdConnectAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-287
    owasp:
    - A07:2021-Identification and Authentication Failures
    confidence: high
    source: Microsoft docs, TokenValidationParameters
- id: gimlet.security.owin-oidc-validate-lifetime-disabled-csharp
  message: |
    TokenValidationParameters.ValidateLifetime = false accepts
    tokens past their expiration. A captured token stays valid
    forever, defeating the point of short-lived JWTs. Remove the
    override; the default is true.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: ValidateLifetime = false
  - pattern-inside: |
      $APP.UseOpenIdConnectAuthentication(new OpenIdConnectAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-613
    owasp:
    - A07:2021-Identification and Authentication Failures
    confidence: high
    source: Microsoft docs, TokenValidationParameters
- id: gimlet.security.owin-oidc-validate-signing-disabled-csharp
  message: |
    TokenValidationParameters.ValidateIssuerSigningKey = false on
    UseOpenIdConnectAuthentication accepts tokens with any signature,
    including no signature. An attacker can forge tokens at will.
    Set ValidateIssuerSigningKey = true and provide IssuerSigningKey
    / IssuerSigningKeys (or rely on MetadataAddress for rotation).
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: ValidateIssuerSigningKey = false
  - pattern-inside: |
      $APP.UseOpenIdConnectAuthentication(new OpenIdConnectAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-347
    owasp:
    - A02:2021-Cryptographic Failures
    confidence: high
    source: Microsoft docs, TokenValidationParameters
- id: gimlet.security.owin-cookie-insecure-csharp
  message: |
    UseCookieAuthentication with CookieSecure = CookieSecureOption.Never
    sends the auth cookie over plain HTTP. Use
    CookieSecureOption.Always in production; use SameAsRequest only
    during local development when HTTPS isn't wired up.
  severity: ERROR
  languages:
  - csharp
  patterns:
  - pattern: CookieSecure = CookieSecureOption.Never
  - pattern-inside: |
      $APP.UseCookieAuthentication(new CookieAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-614
    owasp:
    - A02:2021-Cryptographic Failures
    confidence: high
    source: Microsoft docs, CookieAuthenticationOptions
- id: gimlet.security.owin-cookie-http-only-off-csharp
  message: |
    UseCookieAuthentication with CookieHttpOnly = false exposes the
    auth cookie to JavaScript. A single XSS finding turns into
    account takeover: the cookie flows to any fetch call. Remove
    the override; HttpOnly defaults to true.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern: CookieHttpOnly = false
  - pattern-inside: |
      $APP.UseCookieAuthentication(new CookieAuthenticationOptions { ... })
  metadata:
    category: security
    cwe: CWE-1004
    owasp:
    - A05:2021-Security Misconfiguration
    confidence: high
    source: Microsoft docs, CookieAuthenticationOptions
