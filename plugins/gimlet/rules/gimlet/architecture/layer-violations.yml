rules:
- id: gimlet.architecture.controller-uses-dbcontext-csharp
  message: |
    Controller injects or references DbContext directly. Consider moving
    persistence access behind a service / repository boundary so the
    controller depends on a domain-oriented interface rather than the
    ORM. Helps isolate query logic and keeps controllers focused on
    request/response concerns.
  severity: WARNING
  languages:
  - csharp
  patterns:
  - pattern-either:
    - pattern: |
        public class $C : ControllerBase {
          ...
          private readonly $DB $FIELD;
          ...
        }
    - pattern: |
        public class $C : Controller {
          ...
          private readonly $DB $FIELD;
          ...
        }
  - metavariable-regex:
      metavariable: $DB
      regex: .*DbContext$
  metadata:
    category: architecture
    confidence: medium
    source: Layered architecture — controllers depend on service abstractions, not ORM contexts
